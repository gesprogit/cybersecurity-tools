<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ info.nombre }} · Suite ENS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:#0a0e17; color:#e2e8f0; min-height:100vh; display:flex; flex-direction:column; }
  .franja { background:#12263f; text-align:center; padding:4px; font-size:11px; letter-spacing:3px; color:#7fb3e3; font-family:'Courier New',monospace; }
  .centro { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; }
  .caja { background:#0f1724; border:1px solid #1c2836; border-radius:12px; padding:48px; text-align:center; max-width:480px; }
  .icono { font-size:56px; margin-bottom:16px; }
  h1 { color:#4cc9e8; font-size:22px; margin-bottom:6px; }
  .norma { font-size:12px; color:#5c7089; font-family:'Courier New',monospace; margin-bottom:20px; }
  .badge { display:inline-block; font-size:12px; padding:6px 16px; border-radius:20px; background:#2b210c; color:#fbbf24; border:1px solid #713f12; margin-bottom:24px; }
  p { color:#8fa3b8; font-size:14px; line-height:1.6; margin-bottom:24px; }
  a.volver { display:inline-block; color:#4cc9e8; text-decoration:none; font-size:14px; }
</style>
</head>
<body>
  <div class="franja">SIN CLASIFICAR</div>
  <div class="centro">
    <div class="caja">
      <div class="icono">🚧</div>
      <h1>{{ info.nombre }}</h1>
      <div class="norma">{{ info.norma }}</div>
      <div class="badge">⏳ En desarrollo · No disponible</div>
      <p>{{ info.desc }}.<br>Esta herramienta se publicará en una próxima actualización de la plataforma.</p>
      <a class="volver" href="/dashboard">← Volver al panel</a>
    </div>
  </div>
</body>
</html>
