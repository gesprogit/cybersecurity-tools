<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ info.nombre }} · Suite ENS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:#0b0f1a; color:#e2e8f0; min-height:100vh; display:flex; flex-direction:column; }
  .franja { background:#1e3a5f; text-align:center; padding:4px; font-size:11px; letter-spacing:3px; color:#93c5fd; font-family:'Courier New',monospace; }
  .centro { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; }
  .caja { background:#111827; border:1px solid #1f2937; border-radius:12px; padding:48px; text-align:center; max-width:480px; }
  .icono { font-size:56px; margin-bottom:16px; }
  h1 { color:#22d3ee; font-size:22px; margin-bottom:6px; }
  .norma { font-size:12px; color:#64748b; font-family:'Courier New',monospace; margin-bottom:20px; }
  p { color:#94a3b8; font-size:14px; line-height:1.6; margin-bottom:24px; }
  .fase { display:inline-block; background:#1e3a5f; color:#93c5fd; padding:6px 16px; border-radius:20px; font-size:13px; margin-bottom:24px; }
  a.volver { display:inline-block; color:#22d3ee; text-decoration:none; font-size:14px; }
</style>
</head>
<body>
  <div class="franja">SIN CLASIFICAR</div>
  <div class="centro">
    <div class="caja">
      <div class="icono">🚧</div>
      <h1>{{ info.nombre }}</h1>
      <div class="norma">{{ info.norma }}</div>
      <div class="fase">En migración · Fase {{ info.fase }}</div>
      <p>{{ info.desc }}.<br>Esta herramienta se activará en la próxima fase del proyecto.</p>
      <a class="volver" href="/dashboard">← Volver al panel</a>
    </div>
  </div>
</body>
</html>
